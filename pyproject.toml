[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptrace-ai"
version = "1.0.0"
description = "Multimodal Deepfake Forensic Investigation & Synthetic Media Detection Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "soundfile>=0.12.1",
    "imageio-ffmpeg>=0.4.9",
    "pydantic>=2.5",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytest>=7.4"
]

[tool.setuptools.packages.find]
include = ["deeptrace*"]
